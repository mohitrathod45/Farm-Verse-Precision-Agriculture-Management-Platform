# Active Spring Profile (Loads application-local.properties for secrets & local environment)
spring.profiles.active=local

# Database Connection (Railway MySQL)
spring.datasource.url=jdbc:mysql://tokaido.proxy.rlwy.net:31012/railway
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server & JWT Security
server.port=8080

# JWT Expiration Configuration
jwt.expiration=86400000

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.farmverse=DEBUG

# Google Gemini AI Model Configuration
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Government Mandi Price API Configuration
mandi.api.key=${MANDI_API_KEY:}
mandi.api.url=https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070