# Active Spring Profile (Loads application-local.properties for local environment & secrets)
spring.profiles.active=local

# Local Database Connection (MySQL)
spring.datasource.url=jdbc:mysql://altaria.proxy.rlwy.net:26309/railway?useSSL=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server & Security
server.port=8080

# JWT Expiration Configuration
jwt.expiration=86400000

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.farmverse=DEBUG

# Google Gemini AI Model Configuration
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Government Mandi Price API Configuration
mandi.api.key=${MANDI_API_KEY:}
mandi.api.url=https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070

