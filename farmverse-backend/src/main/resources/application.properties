
#  Database Connection (Local MySQL)

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/farmverse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#  Server & JWT Security

server.port=8080

# JWT Configuration used by your AuthContext for token generation
jwt.secret=ThisIsMySecretKeyForFarmVerseApplication12345678901234567890
jwt.expiration=86400000

# Critical Login Fix (Plain Text Password Mode)

spring.security.password.encoder=org.springframework.security.crypto.password.NoOpPasswordEncoder

# Logging (For debugging 401 errors)

logging.level.org.springframework.security=DEBUG
logging.level.com.farmverse=DEBUG

# Google Gemini AI Configuration (API KEY REQUIRED)

spring.ai.google.genai.api-key=
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Government Mandi Price API

mandi.api.key=579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b
mandi.api.url=https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070