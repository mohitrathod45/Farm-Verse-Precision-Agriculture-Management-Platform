# Active Spring Profile
spring.profiles.active=local

# Database Configuration (Non-secret)
spring.datasource.url=jdbc:mysql://tokaido.proxy.rlwy.net:31012/railway
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=8080

# JWT Expiration Configuration
jwt.expiration=86400000

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.farmverse=DEBUG

# Spring AI Google GenAI Model Configuration
spring.ai.google.genai.chat.options.model=gemini-2.5-flash